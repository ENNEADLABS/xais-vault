name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Ne pas lancer sur les PRs de dépendances (Dependabot, Renovate)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(py|ts|tsx)$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          FILE_COUNT=$(echo "$FILES" | grep -c . || echo 0)
          echo "count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code review
        if: steps.changed.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p \
            --output-format json \
            "Tu es un reviewer pour le projet XAIS Vault (SaaS multi-tenant, FastAPI + Next.js).

          Review les fichiers modifiés dans cette PR. Vérifie :

          SÉCURITÉ (bloquant) :
          - JWT vérifié avec PyJWT + SUPABASE_JWT_SECRET sur chaque endpoint protégé
          - organization_id filtré dans chaque requête DB (defense in depth)
          - Pas de .single() sur Supabase
          - Pas de secrets hardcodés
          - Pas de faille XSS, injection SQL, CSRF

          QUALITÉ :
          - Fichiers Python < 200 lignes, composants React < 150 lignes
          - Pas de console.log/print en production
          - Appels LLM via packages/llm/ uniquement
          - Travail lourd via job queue, pas asyncio.create_task
          - Format erreur API : {\"error\": {\"code\": \"...\", \"message\": \"...\"}}

          CONVENTIONS :
          - Commits conventionnels (feat/fix/refactor)
          - Nommage : snake_case Python, PascalCase composants React
          - Types explicites (pas de any en TypeScript)

          Fichiers modifiés :
          ${{ steps.changed.outputs.files }}

          Réponds en JSON strict :
          {
            \"findings\": [
              {\"file\": \"path\", \"line\": 0, \"severity\": \"critical|high|medium|low\", \"category\": \"security|quality|convention\", \"message\": \"description\"}
            ],
            \"summary\": \"résumé en 2-3 phrases\",
            \"approve\": true/false
          }

          Si aucun problème trouvé, retourne findings vide et approve true." \
            > review-output.json 2>/dev/null || true

      - name: Post review comment
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = await import('fs');

            let review;
            try {
              const raw = readFileSync('review-output.json', 'utf8');
              review = JSON.parse(raw);
              // Claude -p wraps output in a result field
              if (review.result) {
                review = JSON.parse(review.result);
              }
            } catch (e) {
              console.log('Could not parse review output:', e.message);
              return;
            }

            if (!review.findings && !review.summary) return;

            const findings = review.findings || [];
            const summary = review.summary || 'Review terminée.';
            const approve = review.approve !== false;

            let body = `## 🤖 Claude Code Review\n\n${summary}\n\n`;

            if (findings.length === 0) {
              body += '✅ Aucun problème détecté.\n';
            } else {
              const critical = findings.filter(f => f.severity === 'critical');
              const high = findings.filter(f => f.severity === 'high');
              const medium = findings.filter(f => f.severity === 'medium');
              const low = findings.filter(f => f.severity === 'low');

              if (critical.length > 0) {
                body += `### 🔴 Critique (${critical.length})\n`;
                critical.forEach(f => { body += `- **${f.file}:${f.line}** — ${f.message}\n`; });
                body += '\n';
              }
              if (high.length > 0) {
                body += `### 🟠 Haute (${high.length})\n`;
                high.forEach(f => { body += `- **${f.file}:${f.line}** — ${f.message}\n`; });
                body += '\n';
              }
              if (medium.length > 0) {
                body += `### 🟡 Moyenne (${medium.length})\n`;
                medium.forEach(f => { body += `- **${f.file}:${f.line}** — ${f.message}\n`; });
                body += '\n';
              }
              if (low.length > 0) {
                body += `### 🔵 Basse (${low.length})\n`;
                low.forEach(f => { body += `- **${f.file}:${f.line}** — ${f.message}\n`; });
                body += '\n';
              }
            }

            body += '\n---\n*Review automatique par Claude Code (`-p --output-format json`)*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
