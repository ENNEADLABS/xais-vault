[project]
name = "xais-vault-mcp"
version = "2.0.0"
description = "MCP server exposing XAIS Vault API as tools for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]

[project.scripts]
xais-vault-mcp = "src.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
