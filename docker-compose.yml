version: "3.9"

services:
  # ─── API Server ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    depends_on:
      - redis
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Worker ────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    depends_on:
      - redis
    command: python -m apps.worker.app.main

  # ─── Redis (local dev, replaces Upstash) ───────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── Frontend ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    volumes:
      - ./apps/web/src:/app/src
    command: npm run dev
